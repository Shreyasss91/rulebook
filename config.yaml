# Deduplication Configuration
# All paths relative to project root or absolute

docs_source:
  - "D:/Office PC/D DRIVE/KERC"

# High priority - commonly found in regulatory/legal corpora
file_types:
  - "pdf"
  - "txt"
  - "docx"
  - "doc"
  - "md"
  - "rtf"          # Rich Text Format - common in govt docs
  - "xlsx"         # Excel - tariff tables, schedules
  - "xls"          # Legacy Excel
  - "xlsm"         # Excel with macros
  - "csv"          # Comma-separated data tables

# Medium priority - check if present in your corpus
#   - "odt"          # OpenDocument Text
#   - "html"         # Web-sourced regulations
#   - "htm"          # Legacy HTML
#   - "json"         # Structured data/APIs
#   - "xml"          # Legal markup (Akoma Ntoso)

# Low priority - rare in regulatory contexts
#   - "epub"         # Published regulations
#   - "pptx"         # Presentations
#   - "ppt"          # Legacy PowerPoint

ignore_list_path: "docs/deduplication_ignore_list.json"
progress_path: "docs/deduplication_progress.json"
batch_size: 100
signature_prefix_chars: 300

# --- Incremental update settings (scripts/incremental_ingest.py) ---------
manifest_path: "docs/file_manifest.json"
track_moves: true          # same content_hash at a new path = MOVED, not NEW+DELETED
track_deletions: true      # drop chunks for files that disappeared
max_retries: 3             # give up on repeatedly failing files (unreadable/corrupt)

# Office owner/lock files: transient artefacts created while a document is open
# (~$Report.docx from Word/Excel, .~lock.Report.odt# from LibreOffice). They hold
# no real content, so they are skipped at scan time rather than failing as errors.
# Matched against the file name, not the path.
lock_file_patterns:
  - "~$*"
  - ".~lock.*#"

# Chunking — legal-aware, so rule/section numbering stays intact
chunk_size: 1200           # target characters per chunk
chunk_overlap: 200         # characters carried from the previous chunk
min_chunk_chars: 200       # shorter chunks are merged into their neighbour

# Embeddings + vector store (sentence-transformers / chromadb must be installed)
embedding_model: "all-MiniLM-L6-v2"
embedding_batch_size: 32
chroma_path: "kerch_db"
collection_name: "kerc_docs"

# OCR fallback trigger: PDFs below this many characters per page are considered
# to have no text layer, and are marked needs_ocr instead of indexed.
ocr_min_chars_per_page: 50

# Spreadsheets: rows kept per sheet before the rest are dropped (keeps a huge
# tariff sheet from becoming one enormous embedding batch).
spreadsheet_max_rows: 5000