# Deduplication Configuration
# All paths relative to project root or absolute

docs_source:
  - "D:/Office PC/D DRIVE/KERC"

# High priority - commonly found in regulatory/legal corpora
file_types:
  - "pdf"
  - "txt"
  - "docx"
  - "doc"
  - "md"
  - "rtf"          # Rich Text Format - common in govt docs
  - "xlsx"         # Excel - tariff tables, schedules
  - "xls"          # Legacy Excel
  - "xlsm"         # Excel with macros
  - "csv"          # Comma-separated data tables

# Medium priority - check if present in your corpus
#   - "odt"          # OpenDocument Text
#   - "html"         # Web-sourced regulations
#   - "htm"          # Legacy HTML
#   - "json"         # Structured data/APIs
#   - "xml"          # Legal markup (Akoma Ntoso)

# Low priority - rare in regulatory contexts
#   - "epub"         # Published regulations
#   - "pptx"         # Presentations
#   - "ppt"          # Legacy PowerPoint

ignore_list_path: "docs/deduplication_ignore_list.json"
progress_path: "docs/deduplication_progress.json"
batch_size: 100
signature_prefix_chars: 300

# --- Incremental update settings (scripts/incremental_ingest.py) ---------
manifest_path: "docs/file_manifest.json"
track_moves: true          # same content_hash at a new path = MOVED, not NEW+DELETED
track_deletions: true      # drop chunks for files that disappeared
max_retries: 3             # give up on repeatedly failing files (unreadable/corrupt)

# Office owner/lock files: transient artefacts created while a document is open
# (~$Report.docx from Word/Excel, .~lock.Report.odt# from LibreOffice). They hold
# no real content, so they are skipped at scan time rather than failing as errors.
# Matched against the file name, not the path.
lock_file_patterns:
  - "~$*"
  - ".~lock.*#"

# Chunking — legal-aware, so rule/section numbering stays intact
chunk_size: 1200           # target characters per chunk
chunk_overlap: 200         # characters carried from the previous chunk
min_chunk_chars: 200       # shorter chunks are merged into their neighbour

# Embeddings + vector store (sentence-transformers / chromadb must be installed)
# Changing embedding_model changes the vector space, so the manifest's
# embedding_fingerprint makes the next ingest re-embed every indexed file.
# See docs/stack_choices.md before switching to a multilingual model.
embedding_model: "all-MiniLM-L6-v2"
embedding_batch_size: 32
chroma_path: "kerch_db"
collection_name: "kerc_docs"

# OCR fallback trigger: PDFs below this many characters per page are considered
# to have no text layer, and are marked needs_ocr instead of indexed. It is also the
# per-page trigger of the OCR pass: a page below it gets OCR'd.
ocr_min_chars_per_page: 50

# --- OCR pass (docs/ocr_pass_design.md) ----------------------------------
# Runs between extraction and chunking, only for pages with no text layer, and only
# on a real run (--dry-run/--audit never OCR, so they cannot spend anything).
ocr_backend: "hybrid"          # none | tesseract | novita | hybrid
ocr_dpi: 300                   # page render resolution for scanned orders
ocr_languages: "eng+kan"       # strict: a missing pack parks files, never garbles text
ocr_cache_path: "data/ocr_cache"   # gitignored; OCR text keyed by content_hash
ocr_pdf_path: "data/ocr_pdfs"      # gitignored; searchable PDFs for OCR'd files only
ocr_write_searchable_pdfs: true    # best-effort ocrmypdf --skip-text artefact
ocr_escalate_below_chars: 200      # hybrid: escalate a page Tesseract read below this
ocr_max_pages_per_file: 500        # runaway-document cap
ocr_api_url: "https://api.novita.ai/v3/openai/chat/completions"
ocr_api_model: "deepseek/deepseek-ocr-2"
ocr_api_key_env: "NOVITA_API_KEY"  # read from the environment, never from this file
ocr_api_timeout: 60
ocr_api_cost_per_page: 0.0001      # only used for the run's cost estimate

# Spreadsheets: rows kept per sheet before the rest are dropped (keeps a huge
# tariff sheet from becoming one enormous embedding batch).
spreadsheet_max_rows: 5000

# --- Query CLI (scripts/query_cli.py) ------------------------------------
# Reads the same collection incremental_ingest.py wrote. Answer generation is
# optional: without a usable LLM the CLI still returns the cited excerpts.
llm_backend: "ollama"          # ollama (local, default) | claude | none
llm_top_k: 6                   # excerpts retrieved per question
llm_min_score: 0.0             # cosine similarity floor; 0 drops anti-correlated chunks
llm_max_context_chars: 6000    # cap on the excerpt text sent to the model
# Ollama: free, local, private. Server + models: https://ollama.com
llm_ollama_url: "http://localhost:11434"
llm_ollama_model: "llama3.2:3b"
llm_ollama_timeout: 120
# Claude API: better reasoning, key read from the environment. Set a current
# model id from https://platform.claude.com/docs/en/api/models/list before use.
llm_claude_url: "https://api.anthropic.com/v1/messages"
llm_claude_model: "claude-sonnet-4-5"
llm_claude_api_key_env: "ANTHROPIC_API_KEY"
llm_claude_max_tokens: 1024
llm_claude_timeout: 120
llm_anthropic_version: "2023-06-01"